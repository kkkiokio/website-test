<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
  />
  <title>Live Translation – 还原稿</title>
  <style>
    /* ===== 基础设置（以 750×1624 设计稿为参考） ===== */
    :root {
      --w: 750;      /* 设计宽度 */
      --h: 1624;     /* 设计高度 */
      --bg: #000;
      --text: #e9eef4;
      --muted: #9aa4af;
      --accent: #34c3ff;   /* 青色高亮 */
      --tab: #cfd8e3;
      --tab-active: #fff;
      --line: #1f2937;
      --orange: #ff7a00;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0f16;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                   Segoe UI, Roboto, Arial, "Noto Sans SC", "Hiragino Sans GB", sans-serif;
      color: var(--text);
    }

    /* 画板容器（等比缩放以适配任意屏宽） */
    .stage {
      position: relative;
      width: min(100vw, 750px);
      aspect-ratio: var(--w) / var(--h);
      margin-inline: auto;
      background: var(--bg);
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    /* 顶部状态栏（简化展示） */
    .statusbar {
      height: 88px; /* 88px ≈ iOS 顶部安全区+状态栏（按 750 宽标注） */
      padding: 26px 30px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      opacity: .95;
      pointer-events: none;
      font-weight: 600;
    }
    .statusbar .right {
      display: flex; gap: 16px; align-items: center; font-weight: 500;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity:.9 }

    /* 头图区域 */
    .hero {
      position: relative;
      height: 340px;
      background:
        radial-gradient(1200px 420px at 80% -10%, #0d2a4a 20%, transparent 60%),
        linear-gradient(135deg, #0b1e33 0%, #0e2d4e 55%, #0a1a2d 100%);
      display: flex;
      align-items: flex-end;
      padding: 0 30px 22px;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient( to bottom, rgba(0,0,0,.0) 0%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.35) 100% );
      pointer-events: none;
    }

    /* 语言选择胶囊 */
    .lang-chip {
      position: absolute; top: 128px; left: 30px;
      display: inline-flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      border-radius: 22px;
      color: #d6e4ee;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      font-size: 22px; font-weight: 600;
    }
    .lang-chip svg { width: 24px; height: 24px; opacity:.9 }

    /* 圆形按钮（扬声器/分享） */
    .hero-actions {
      position: absolute; top: 122px; right: 30px; display: flex; gap: 16px;
    }
    .circle-btn {
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .circle-btn svg { width: 30px; height: 30px; fill: #e6f0f7 }
    .title {
      position: absolute; inset: auto 0 48px 0;
      text-align: center; z-index: 1;
      font-size: 56px; font-weight: 700; letter-spacing: .5px;
      color: rgba(220,235,248,.85);
      text-shadow: 0 6px 30px rgba(0,0,0,.45);
    }

    /* Tab 切换 */
    .tabs {
      display: flex; gap: 46px; padding: 22px 30px 10px; border-bottom: 1px solid var(--line);
      background: #0b1017;
    }
    .tab {
      position: relative; padding: 12px 6px 18px; font-size: 28px; color: var(--tab);
      font-weight: 600; cursor: default;
    }
    .tab.active { color: var(--tab-active); }
    .tab.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      border-radius: 2px; background: linear-gradient(90deg, #5fd1ff, #9fe7ff);
    }

    /* 正文内容 */
    .content {
      padding: 34px 30px 0;
      line-height: 1.9;
      font-size: 28px;
      color: #e7edf4;
    }
    .content p { margin: 0 0 22px; }
    .content .lead {
      font-size: 30px; font-weight: 700; color: #f4f8fb;
    }
    .content .highlight {
      color: var(--accent);
      margin-top: 34px;
      font-weight: 700;
    }

    /* 底部提示 */
    .footer {
      position: absolute; left: 0; right: 0; bottom: 24px;
      text-align: center; color: var(--orange); font-size: 26px; letter-spacing: .5px;
    }

    /* 小屏优雅降级（去边角、拉伸为全屏） */
    @media (max-width: 380px) {
      .stage { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="stage" role="application" aria-label="Live Translation Screen">
    <!-- 简化状态栏 -->
    <div class="statusbar">
      <div>9:41</div>
      <div class="right">
        <div class="dot"></div>
        <div class="dot" style="opacity:.7"></div>
        <div class="dot" style="opacity:.5"></div>
      </div>
    </div>

    <!-- 头图 -->
    <header class="hero">
      <div class="lang-chip" aria-label="当前语言：中文">
        <!-- 地球图标 -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2Zm7.93 9h-3.09a15.8 15.8 0 0 0-1.14-5.11A8.01 8.01 0 0 1 19.93 11ZM12 4c.86 1.21 1.83 3.46 2.1 7H9.9c.27-3.54 1.24-5.79 2.1-7ZM8.2 4.89A15.8 15.8 0 0 0 7.16 11H4.07a8.01 8.01 0 0 1 4.13-6.11ZM4.07 13h3.09c.26 2.38.98 4.35 1.92 5.86A8.01 8.01 0 0 1 4.07 13Zm7.93 7c-.86-1.21-1.83-3.46-2.1-7h4.2c-.27 3.54-1.24 5.79-2.1 7Zm3.8-1.11c.94-1.51 1.66-3.48 1.92-5.86h3.09a8.01 8.01 0 0 1-4.13 6.11Z"/></svg>
        中文
      </div>

      <div class="hero-actions" aria-label="操作">
        <!-- 扬声器 -->
        <button class="circle-btn" aria-label="朗读">
          <svg viewBox="0 0 24 24" role="img"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 3a1 1 0 0 0 1.6-.8V6.8A1 1 0 0 0 11 6l-4 3H4a1 1 0 0 0-1 1Zm12.6-3.5a1 1 0 0 0-1.2 1.6A4.98 4.98 0 0 1 16 12c0 1.6-.77 3.03-1.6 3.9a1 1 0 1 0 1.4 1.4C17.1 16.9 18 14.6 18 12s-.9-4.9-2.2-6.3a1 1 0 0 0-.2-.2ZM18.8 4.2a1 1 0 0 0-1.4 1.4C19.2 7.4 20 9.6 20 12s-.8 4.6-2.6 6.4a1 1 0 1 0 1.4 1.4C21 17.6 22 14.9 22 12s-1-5.6-3.2-7.8Z"/></svg>
        </button>
        <!-- 分享 -->
        <button class="circle-btn" aria-label="分享">
          <svg viewBox="0 0 24 24" role="img"><path d="M18 16a3 3 0 0 0-2.65 1.59l-6.05-3.02a3.1 3.1 0 0 0 0-1.14l6.05-3.02A3 3 0 1 0 14 6a2.98 2.98 0 0 0 .35 1.41L8.3 10.43a3 3 0 1 0 0 3.14l6.05 3.02A3 3 0 1 0 18 16Z"/></svg>
        </button>
      </div>

      <div class="title">Live Translation</div>
    </header>

    <!-- Tabs -->
    <nav class="tabs" aria-label="模式切换">
      <div class="tab active">翻译</div>
      <div class="tab">双语</div>
    </nav>

    <!-- 正文 -->
    <section class="content">
      <p class="lead">
        我们生活在这个美丽的地球上，大自然赋予了我们无尽的资源和壮丽的风景。
        然而，如今我们却面临着前所未有的环境挑战。空气不再清新，河流不再清澈，
        森林在不断减少，生物多样性遭受严重威胁。我们不禁要问，我们的地球怎么了？
      </p>
      <p class="highlight">
        环境问题的产生，源于人类的过度开发和不合理的生活方式。
      </p>
    </section>

    <!-- 底部提示 -->
    <div class="footer">演讲已结束</div>
  </main>
</body>
</html>
